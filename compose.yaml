services:
  postgres:
    image: postgres:16-alpine
    environment:
      PYTHONPATH: /app/src
      POSTGRES_DB: driftsentry
      POSTGRES_USER: driftsentry
      POSTGRES_PASSWORD: driftsentry
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U driftsentry -d driftsentry"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    environment:
      PYTHONPATH: /app/src
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://driftsentry:driftsentry@postgres:5432/driftsentry}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173"]}
      INGESTION_KEY_PEPPER: ${INGESTION_KEY_PEPPER:-development-only-change-me}
    command: sh -c "alembic upgrade head && uvicorn driftsentry_api.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend/src:/app/src
      - ./backend/tests:/app/tests
      - ./backend/migrations:/app/migrations
      - ./backend/alembic.ini:/app/alembic.ini
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:
